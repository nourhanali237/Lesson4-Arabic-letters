<div class="bubo-wrapper">

    <!-- Speech Bubble -->
    <div class="bubo-speech" id="buboSpeech">
        Hello! I'm Bubo! 👋
        <br>
        Are you ready to learn?
    </div>

    <!-- Bubo -->
    <div class="bubo" id="bubo">

        <!-- Ears -->
        <div class="bubo-ear left"></div>
        <div class="bubo-ear right"></div>

        <!-- Head -->
        <div class="bubo-head">

            <div class="bubo-face">

                <!-- Eyebrows -->
                <div class="bubo-eyebrow left"></div>
                <div class="bubo-eyebrow right"></div>

                <!-- Eyes -->
                <div class="bubo-eye left">
                    <div class="bubo-pupil"></div>
                </div>

                <div class="bubo-eye right">
                    <div class="bubo-pupil"></div>
                </div>

                <!-- Beak -->
                <div class="bubo-beak"></div>

            </div>

        </div>

        <!-- Body -->
        <div class="bubo-body">

            <div class="bubo-belly"></div>

            <div class="bubo-wing left"></div>
            <div class="bubo-wing right"></div>

        </div>

        <!-- Feet -->
        <div class="bubo-foot left"></div>
        <div class="bubo-foot right"></div>

    </div>

</div>
